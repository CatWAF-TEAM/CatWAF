# test/fixtures/nginx-php-fpm — live-test fixture for `catwaf auto`.
#
# Reproduces the standard split PHP deployment that `catwaf auto` must
# recognize: nginx and PHP-FPM in SEPARATE containers on a shared Docker
# network, plus a database container that is not a web service at all.
#
#     freshmart_nginx  nginx stable       container 80,   NOT published
#     freshmart_php    (built here)        container 9000, not published
#     freshmart_db     Alpine MariaDB     container 3306, not published
#
# NOTHING here is published to the host. That is the point: CatWAF must
# discover the nginx service on the Docker network and route to it as
# `nginx:80`, without depending on a host port mapping. A published port is
# not a prerequisite for being a web application — and an unpublished app is
# the safer deployment, since CatWAF becomes the only way in.
#
# Usage:
#   docker compose -p fake-web -f test/fixtures/nginx-php-fpm/docker-compose.yml up -d --build
#   catwaf auto --dry-run
#   docker compose -p fake-web -f test/fixtures/nginx-php-fpm/docker-compose.yml down -v
#
# Expected discovery result:
#   ✓ nginx   Web server: nginx / Runtime: PHP 8.3 / backend freshmart_php:9000
#   ○ php     PHP-FPM backend for nginx
#   ○ db      No HTTP service detected
#
# Nothing here is intentionally vulnerable — it is a plain PHP page used to
# verify detection, not WAF blocking behaviour (docker/TestApp.Dockerfile
# covers that).

services:
  nginx:
    build:
      context: .
      dockerfile: Nginx.Dockerfile
    image: catwaf-fixture-nginx
    container_name: freshmart_nginx
    restart: unless-stopped
    # Deliberately NOT published to the host. This fixture exists to verify
    # that CatWAF discovers a Docker-internal HTTP service and routes to it
    # by network alias — a container must not need a host port mapping to be
    # recognized as a web application. Do not add a `ports:` mapping here.
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:ro
    depends_on:
      - php
    networks:
      - freshmart
    security_opt:
      - no-new-privileges:true

  php:
    build:
      context: .
      dockerfile: Php.Dockerfile
    image: fake-web-php
    container_name: freshmart_php
    restart: unless-stopped
    # Deliberately NOT published — PHP-FPM speaks FastCGI, and reaching it
    # from the host is neither needed nor desirable.
    expose:
      - "9000"
    volumes:
      - ./www:/var/www/html:ro
    networks:
      - freshmart
    security_opt:
      - no-new-privileges:true

  db:
    build:
      context: ..
      dockerfile: Database.Dockerfile
    image: catwaf-fixture-database
    container_name: freshmart_db
    restart: unless-stopped
    expose:
      - "3306"
    networks:
      - freshmart
    security_opt:
      - no-new-privileges:true

networks:
  freshmart:
