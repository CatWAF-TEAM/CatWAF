# docker-compose.yml — the full CatWAF stack: backend API, Caddy (dashboard
# + WAF), and a local-only test app so the WAF demo has something to protect.
#
# Ports:
#   :80 / :443  public traffic for the protected website, inspected by Coraza
#   :8081       CatWAF admin dashboard, loopback-only
#   :8082       the protected website's own origin, loopback-only (see test-app)
#
# Quick start:
#   cp .env.example .env      # then set JWT_SECRET at minimum
#   docker compose up --build
#   open http://localhost:8081                                 (dashboard)
#   curl "http://localhost/"                                   (allowed)
#   curl "http://localhost/?id=1+UNION+SELECT+1,2,3--"         (blocked)
#
# NO DOCKER SOCKET. The backend reloads Caddy over Caddy's own admin API
# over a permissioned Unix socket shared only with the backend. The origin
# container cannot reach the configuration API over the compose network.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catwaf-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      CATWAF_INTERNAL_HOST: backend
      CADDYFILE_PATH: /etc/caddy/Caddyfile
      CADDY_ADMIN_SOCKET: /run/catwaf-admin/admin.sock
      CORAZA_AUDIT_LOG: /var/log/coraza/audit.json
    ports:
      # Loopback only. The dashboard reaches the API through Caddy on :80
      # (`reverse_proxy backend:8000` over the compose network), so nothing
      # needs this port from another machine — it is published for local
      # inspection and healthchecks. The container binds 0.0.0.0 internally
      # because a container's loopback is its own; this line, not the bind
      # address, is what decides who can reach it.
      - "127.0.0.1:8000:8000"
    volumes:
      - catwaf-data:/app/data
      - caddy-config:/etc/caddy
      - coraza-logs:/var/log/coraza
      - caddy-admin:/run/catwaf-admin:ro
    depends_on:
      - caddy
    security_opt:
      - no-new-privileges:true
    # node user on high port :8000 needs no capabilities — run with none.
    cap_drop:
      - ALL
    # Keep scratch files out of the container's writable layer.
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    build:
      context: .
      dockerfile: docker/Caddy.Dockerfile
    container_name: catwaf-caddy
    restart: unless-stopped
    ports:
      # Public traffic for the protected website. This is the WAF-inspected
      # path — everything here goes through Coraza before it reaches the
      # origin. :443 is published so that swapping the `:80` site block in
      # docker/Caddyfile for a real domain gives you automatic HTTPS without
      # having to edit this file too.
      - "80:80"
      - "443:443"
      # CatWAF's own admin dashboard (control panel UI + its /api and /g
      # routes, proxied to backend:8000). Separate from the protected site so
      # the two can never collide on one port.
      - "127.0.0.1:8081:8081"
    # The admin API has no TCP listener; its socket volume is backend-only.
    volumes:
      - caddy-config:/etc/caddy
      # Certificate keys, ACME accounts and Caddy's saved runtime config must
      # survive `compose down` followed by `up`, not just container restarts.
      - caddy-data:/data
      - caddy-runtime-config:/config
      - coraza-logs:/var/log/coraza
      - caddy-admin:/run/catwaf-admin
      - catwaf-data:/app/data:ro
    group_add:
      - "1000"
    depends_on:
      - test-app
    security_opt:
      - no-new-privileges:true
    # Serves :80/:443, so bind-to-privileged-port is the one capability kept;
    # everything else is dropped. NOT read-only — Caddy writes certs/config
    # to its volumes.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The protected website's origin. Locally this is an intentionally
  # vulnerable demo app used to show that the WAF actually blocks; in a real
  # deployment you replace it with your own application (see docs/docker.md).
  #
  # It listens on 8080 INSIDE the container — that internal port is what
  # Caddy dials over the compose network (`reverse_proxy test-app:8080` in
  # docker/Caddyfile), and it does not change. The host mapping below is what
  # makes the origin addressable as :8082 from this machine.
  #
  # 127.0.0.1 ONLY. :8082 is the un-inspected origin — a request sent there
  # bypasses Coraza entirely, which is exactly what the Origin Exposure
  # Scanner warns about. It is published so you can demonstrate the
  # difference (:80 blocks, :8082 does not) and so `catwaf doctor` can see
  # the origin, never so the internet can reach it. Do not widen this bind,
  # and do not publish it at all if you swap in a real application.
  test-app:
    build:
      context: .
      dockerfile: docker/TestApp.Dockerfile
    container_name: catwaf-test-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  catwaf-data:
  caddy-config:
  caddy-data:
  caddy-runtime-config:
  coraza-logs:
  caddy-admin:
