  /api/upload-scan/status:
    get:
      tags:
        - Protection
      summary: Whether upload malware scanning is enabled and whether a scanner is reachable
      description: >
        A missing clamd is reported as an availability fact, not an error — CatWAF never installs or bundles
        an AV engine, so "not installed" is a normal state. Pass refresh=true to bypass the cached health
        result.
      security:
        - bearerAuth: []
          requestSignature: []
          requestTimestamp: []
          requestNonce: []
      parameters:
        - in: query
          name: refresh
          schema:
            type: boolean
          description: Re-probe the daemon instead of using the cached result
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  scanner:
                    type: object
                    description: Reachability of the local clamd daemon, and its version when available.
                  paths:
                    type: array
                    items:
                      type: string
                  methods:
                    type: array
                    items:
                      type: string
                  action:
                    type: string
                    enum:
                      - block
                      - flag
                  fail_open:
                    type: boolean
                  max_scan_bytes:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Rotating API segment expired; obtain a fresh segment from /api/handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: get_api_upload_scan_status
      x-catwaf-source: backend/routes/protect.js
      x-catwaf-access: session
      servers:
        - url: /g/{segment}
          description: Use the current segment returned by login or handshake.
          variables:
            segment:
              default: '00000000000000000000000000000000'
              description: Replace with api.segment from the live session; the placeholder is not usable.
