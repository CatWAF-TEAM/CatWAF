  /api/wellknown/security.txt:
    get:
      tags:
        - Settings
      summary: Validate and preview generated security.txt
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  body:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Rotating API segment expired; obtain a fresh segment from /api/handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: get_api_wellknown_security_txt
      x-catwaf-source: backend/routes/settings.js
      security:
        - bearerAuth: []
          requestSignature: []
          requestTimestamp: []
          requestNonce: []
      x-catwaf-access: session
      servers:
        - url: /g/{segment}
          description: Use the current segment returned by login or handshake.
          variables:
            segment:
              default: '00000000000000000000000000000000'
              description: Replace with api.segment from the live session; the placeholder is not usable.
  /catwaf-challenge:
    get:
      tags:
        - Gateway
      summary: Issue a visitor challenge or redirect a verified visitor
      responses:
        '302':
          description: Challenge is off or visitor already verified.
          headers:
            Location:
              schema:
                type: string
        '429':
          description: Challenge rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Challenge interstitial (expected challenge response, not a backend outage).
          content:
            text/html:
              schema:
                type: string
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
          description: Safe same-origin return path.
      operationId: get_catwaf_challenge
      x-catwaf-source: backend/routes/gateway.js
      security: []
      x-catwaf-access: public
  /catwaf-challenge/status:
    get:
      tags:
        - Gateway
      summary: Read visitor verification state
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  mode:
                    type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_catwaf_challenge_status
      x-catwaf-source: backend/routes/gateway.js
      security: []
      x-catwaf-access: public
  /catwaf-challenge/verify:
    post:
      tags:
        - Gateway
      summary: Submit a challenge answer and obtain a signed visitor cookie
      responses:
        '302':
          description: Challenge mode is off; redirect to /.
        '303':
          description: Verified; set signed verification cookie and redirect to safe return path.
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string
        '403':
          description: Invalid answer; a new HTML challenge is returned.
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Attempt/rate limit; HTML challenge or JSON rate-limit error.
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                challenge_id:
                  type: string
                answer:
                  type: string
                proof:
                  type: string
                return_to:
                  type: string
                token:
                  type: string
                g-recaptcha-response:
                  type: string
                h-captcha-response:
                  type: string
                cf-turnstile-response:
                  type: string
                mcaptcha__token:
                  type: string
      operationId: post_catwaf_challenge_verify
      x-catwaf-source: backend/routes/gateway.js
      security: []
      x-catwaf-access: public
  /healthz:
    get:
      tags:
        - Gateway
      summary: Check backend liveness
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
      operationId: get_healthz
      security: []
      x-catwaf-access: public
  /metrics:
    get:
      tags:
        - Gateway
      summary: Scrape Prometheus metrics
      description: >-
        Enabled only by metrics settings. Both the token requirement and source-CIDR policy are configurable.
        Defaults require a separate metrics token. If metrics.path differs from /metrics, that configured
        literal path is an additional alias with identical authentication.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authentication or password confirmation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_metrics
      x-catwaf-source: backend/routes/gateway.js
      security:
        - metricsToken: []
      x-catwaf-access: metrics-policy
