  /api/apps/protect:
    post:
      tags:
        - Applications
      summary: Apply the generated configuration, reload, then verify with real traffic
      description: >-
        Admin only, and audited. Rewrites CatWAF's generated region, backs up the previous Caddyfile, reloads,
        then proves the result with a real benign request and a real inert CRS payload against each route.


        Unlike `catwaf auto`, this never starts the proxy: that is a privileged host action. If Caddy is not
        running the response reports the routes as applied but not live, rather than trying to start services.



        Requires the admin role.
      security:
        - bearerAuth: []
          requestSignature: []
          requestTimestamp: []
          requestNonce: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skip_verify:
                  type: boolean
                  default: false
                  description: Apply without verifying. `protected` is then false, because nothing was proven.
      responses:
        '200':
          description: The pipeline ran; read `stage`, `verification` and `protected` for the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Read-only role.
        '409':
          description: Another pipeline run is already in progress.
        '410':
          description: Rotating API segment expired; obtain a fresh segment from /api/handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: post_api_apps_protect
