openapi: 3.0.3
info:
  title: CatWAF API
  version: 1.0.2
  description: >-
    CatWAF control-plane, bootstrap and gateway HTTP API. All fixed API operations expressible with OpenAPI
    HTTP methods are documented and checked against the Express route table in CI. The two internal gateway
    routes marked x-catwaf-express-all also accept HTTP extension methods supported by Node. Static assets and
    the SPA are not API operations. The configurable metrics alias is described on /metrics.


    Protected logical paths such as /api/stats are requested as /g/<segment>/api/stats. Obtain api.basePath
    and sessionKey from login; refresh the segment using the fixed /api/handshake endpoint. Protected
    operations have a relative server URL /g/{segment}. Public, setup, metrics and gateway operations use the
    root server URL.


    Request signing requires a live JWT session AND X-CatWAF-Sig, X-CatWAF-Ts and X-CatWAF-Nonce. The
    signature is lowercase hex HMAC-SHA256 using the login sessionKey string as the UTF-8 key, over five
    newline-separated strings: uppercase HTTP method, logical path including its exact query string (without
    /g/<segment>), timestamp header, nonce header, and lowercase hex SHA256 of the exact JSON body bytes
    (empty bytes when there is no body). The timestamp is Unix milliseconds within two minutes; the nonce is
    16-64 lowercase hex characters and cannot be reused within a session. Serialize the body once and sign
    those exact bytes. The fixed login, auth status and handshake paths do not require a signature. HEAD is
    implicitly supported wherever GET is mounted, with the same authentication and a HEAD signature but no
    response body. Global CORS middleware answers OPTIONS preflight before route authentication.


    The settings API is self-describing: GET /api/settings/schema supplies the authoritative per-group fields,
    types, defaults and permitted values. Configuration mutation responses must be checked for operation
    success and reload/recovery status; HTTP success alone does not establish that a site is protected.
    Dynamic report, plugin and integration payloads explicitly allow extensions.


    Traffic data comes from real audit records; a fresh installation returns empty arrays and zero counts.
    Database restoration is an offline CLI workflow, not an HTTP endpoint. See docs/security-recovery.md.
  license:
    name: PolyForm Internal Use 1.0.0
    url: https://github.com/CatWAF-TEAM/CatWAF/blob/release-1.0.1/LICENSE
externalDocs:
  description: Full documentation
  url: https://github.com/CatWAF-TEAM/CatWAF/tree/release-1.0.1/docs
servers:
  - url: /
    description: Same-origin backend; use HTTPS when exposed beyond loopback
tags:
  - name: Auth
    description: Login and session handling
  - name: WAF Engine
    description: Core engine mode, paranoia level, anomaly thresholds, and the general settings bucket
  - name: Network
    description: IP allow/block lists and geo-blocking
  - name: Security Score
    description: The dashboard's Security page — an honest, state-derived posture score
  - name: Sensitive Files
    description: Blocking access to files that shouldn't be publicly reachable
  - name: Dashboard
    description: Stats, traffic charts, logs, and audit trail
  - name: Settings
    description: The declarative settings layer — read, validate, preview and apply any group
  - name: Protection
    description: Active bans, the challenge gate, behavioural banning and threat intelligence
  - name: Operations
    description: Scheduled jobs, backups, caches, templates, reports, telemetry and metrics
  - name: TLS
    description: Certificate status and validation
  - name: Plugins
    description: The data-only plugin format
  - name: Applications
    description: >-
      Discovering web applications on this host and putting CatWAF in front of them: DISCOVER -> GENERATE ->
      APPLY -> VERIFY
  - name: Bootstrap
  - name: Gateway
  - name: Cloudflare
  - name: CatAI
  - name: Users
  - name: Alerts
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtained from POST /api/auth/login. All protected reads and writes require a valid live session,
        rotating path and request signature. Administrative mutations also require the admin role.
    requestSignature:
      type: apiKey
      in: header
      name: X-CatWAF-Sig
      description: >-
        HMAC-SHA256 request signature; see info.description for canonicalization. Required together with
        bearerAuth, requestTimestamp and requestNonce.
    requestTimestamp:
      type: apiKey
      in: header
      name: X-CatWAF-Ts
      description: Unix milliseconds as a decimal string; maximum clock skew is two minutes.
    requestNonce:
      type: apiKey
      in: header
      name: X-CatWAF-Nonce
      description: Fresh 16-64 character lowercase hexadecimal nonce. Reuse is rejected.
    setupToken:
      type: apiKey
      in: header
      name: X-CatWAF-Setup-Token
      description: >-
        Out-of-band CATWAF_SETUP_TOKEN, at least 32 bytes. Setup exists only before the first account is
        created.
    enforceKey:
      type: apiKey
      in: header
      name: X-CatWAF-Enforce-Key
      description: Instance-derived enforce-key injected by Caddy; never a user session token.
    uploadKey:
      type: apiKey
      in: header
      name: X-CatWAF-Upload-Key
      description: Distinct instance-derived upload-gate-key injected by Caddy.
    metricsToken:
      type: http
      scheme: bearer
      description: Configured metrics token, distinct from the session JWT; also constrained by metrics.allow_cidrs.
  responses:
    Unauthorized:
      description: Authentication, live session or request signature missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation failed — the request body or params didn't pass checks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No matching resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate or concurrency limit exceeded. Limits depend on the operation; respect Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        error:
          type: string
        phase:
          type: string
        rolled_back:
          type: boolean
        rolledBack:
          type: boolean
        recoveryRequired:
          type: boolean
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        totp:
          type: string
          description: Authenticator code or unused recovery code; required when MFA is enabled.
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        sessionKey:
          type: string
          description: Secret signing key; store with the token and never log it.
        api:
          $ref: '#/components/schemas/ApiSegment'
        user:
          $ref: '#/components/schemas/User'
        session:
          type: object
          properties:
            expires_in_min:
              type: integer
            idle_timeout_min:
              type: integer
              nullable: true
            bound:
              type: array
              items:
                type: string
                enum:
                  - ip
                  - browser
      required:
        - token
        - sessionKey
        - api
        - user
        - session
    IpListEntry:
      type: object
      properties:
        ip:
          type: string
          example: 203.0.113.7
        note:
          type: string
        added_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
    AddIpRequest:
      type: object
      required:
        - ip
        - list
      properties:
        ip:
          type: string
          description: IPv4/IPv6 address or CIDR range
          example: 203.0.113.7
        list:
          type: string
          enum:
            - whitelist
            - blacklist
        note:
          type: string
          maxLength: 256
        ttl_minutes:
          type: integer
          description: Auto-expire this entry after N minutes. Omit for a permanent entry.
    CustomRule:
      type: object
      required:
        - value
        - name
      properties:
        id:
          type: string
        variable:
          type: string
          description: Coraza variable, e.g. ARGS, REQUEST_URI, REQUEST_HEADERS:User-Agent
          default: ARGS
        operator:
          type: string
          enum:
            - contains
            - streq
            - beginsWith
            - endsWith
            - rx
            - pm
            - eq
            - ge
            - le
            - gt
            - lt
          default: contains
        value:
          type: string
          maxLength: 512
        name:
          type: string
          maxLength: 128
          description: Used as the rule's msg field
        action:
          type: string
          enum:
            - deny
            - pass
            - allow
            - drop
            - log
            - block
          default: deny
        phase:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
        enabled:
          type: boolean
          default: true
    WafSettings:
      type: object
      description: >-
        The subset of WAF state this endpoint allows reading/writing — see the SETTING_KEYS allow-list in
        routes/waf.js.
      properties:
        allowed_methods:
          type: array
          items:
            type: string
          example:
            - GET
            - POST
            - HEAD
            - OPTIONS
        allowed_content_types:
          type: array
          items:
            type: string
        max_request_body_size:
          type: number
        max_file_upload_size:
          type: number
        request_body_inspection:
          type: boolean
        response_body_inspection:
          type: boolean
        audit_log:
          type: boolean
        enforce_bodyproc_urlencoded:
          type: boolean
        early_blocking:
          type: boolean
        sampling_percentage:
          type: number
          minimum: 0
          maximum: 100
        blocked_user_agents:
          type: array
          items:
            type: string
          example:
            - sqlmap
            - nikto
            - nmap
        header_rules:
          type: array
          items:
            type: object
    SecurityScoreCheck:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        weight:
          type: integer
        status:
          type: string
          enum:
            - pass
            - warn
            - fail
            - unknown
        label:
          type: string
        detail:
          type: string
        recommendation:
          type: string
          nullable: true
    SecurityScore:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        grade:
          type: string
          enum:
            - A
            - B
            - C
            - D
            - F
        checks:
          type: array
          items:
            $ref: '#/components/schemas/SecurityScoreCheck'
        by_category:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SecurityScoreCheck'
        passing:
          type: integer
        warnings:
          type: integer
        critical_failures:
          type: integer
        total_checks:
          type: integer
        recommendations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              recommendation:
                type: string
              severity:
                type: string
                enum:
                  - high
                  - medium
                  - low
        computed_at:
          type: string
          format: date-time
    HoneypotPath:
      type: object
      properties:
        path:
          type: string
          example: /wp-admin/install.php
        label:
          type: string
        enabled:
          type: boolean
    AppliedRoute:
      type: object
      description: One route in CatWAF's generated region of the live Caddyfile.
      properties:
        name:
          type: string
        runtime:
          type: string
          nullable: true
          description: Detected runtime, e.g. "PHP 8.3"
        containerName:
          type: string
          nullable: true
        listenPort:
          type: integer
          description: Port CatWAF listens on for this application
        upstream:
          type: string
          nullable: true
          description: Address CatWAF forwards to once a request passes the WAF
    DiscoveredApp:
      type: object
      description: >
        The safe projection of a discovered container. Raw environment and labels are deliberately absent —
        see backend/services/discovery/summary.js.
      properties:
        name:
          type: string
          description: Compose service name where there is one, otherwise the container name
        containerName:
          type: string
        image:
          type: string
        running:
          type: boolean
        isWeb:
          type: boolean
          description: Whether this serves HTTP and is therefore routable
        webServer:
          type: string
          nullable: true
        webServerConfidence:
          type: number
          nullable: true
        runtime:
          type: string
          nullable: true
        framework:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        published:
          type: boolean
          description: Published to the host — such a port bypasses CatWAF while it stays published
        reachability:
          type: string
          nullable: true
        networks:
          type: array
          items:
            type: string
        phpConfidence:
          type: number
          nullable: true
        fastcgiBackend:
          type: string
          nullable: true
        fpmBackendFor:
          type: array
          nullable: true
          items:
            type: string
        incomplete:
          type: boolean
        evidence:
          type: object
          description: >-
            Why CatWAF classified it this way. Files, processes, ports and config directives — never secret
            values.
          properties:
            web:
              type: array
              items:
                type: string
            php:
              type: array
              items:
                type: string
            runtime:
              type: array
              items:
                type: string
            server:
              type: array
              items:
                type: string
    VerificationResult:
      type: object
      properties:
        name:
          type: string
        protected:
          type: boolean
          description: True only when a benign request was served AND a CRS payload was refused
        reason:
          type: string
          nullable: true
          description: Why the route is not protected
        benignStatus:
          type: integer
          nullable: true
        attackStatus:
          type: integer
          nullable: true
        upstreamUnreachable:
          type: boolean
          description: >-
            CatWAF is listening but the application behind it is down — the site is broken, not merely
            unprotected
        wafBypassed:
          type: boolean
          description: A CRS payload reached the application, so Coraza is not inspecting this route
    Verification:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/VerificationResult'
        protectedCount:
          type: integer
        allProtected:
          type: boolean
    ProtectResult:
      type: object
      properties:
        ok:
          type: boolean
        stage:
          type: string
          description: How far the pipeline got.
          enum:
            - discovery
            - plan
            - dry-run
            - apply
            - applied
            - unverified
            - protected
        dry_run:
          type: boolean
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        containers:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredApp'
        web_apps:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredApp'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/AppliedRoute'
        skipped:
          type: array
          description: Applications CatWAF found but could not route to, with diagnostics.
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
              diagnostics:
                type: array
                items:
                  type: string
        backup:
          type: string
          nullable: true
          description: Path the previous Caddyfile was copied to
        reloaded:
          type: boolean
          nullable: true
        reload_error:
          type: string
          nullable: true
        verification:
          allOf:
            - $ref: '#/components/schemas/Verification'
          nullable: true
        protected:
          type: boolean
          description: >
            Derived solely from `verification.allProtected`. A generated, applied and cleanly reloaded
            configuration does not set this.
    PanicState:
      type: object
      properties:
        active:
          type: boolean
        activated_at:
          type: string
          format: date-time
          nullable: true
        activated_by:
          type: string
          nullable: true
        prior_state:
          type: object
          nullable: true
          description: WAF settings snapshot to restore on deactivate
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - viewer
      required:
        - id
        - username
        - role
    ApiSegment:
      type: object
      properties:
        segment:
          type: string
          pattern: ^[0-9a-f]{32}$
        basePath:
          type: string
        expiresAt:
          type: integer
          description: Unix milliseconds
        windowMs:
          type: integer
    Template:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        built_in:
          type: boolean
        settings:
          type: object
          additionalProperties: true
          description: Group-name to validated, secret-redacted settings object.
        waf:
          type: object
          additionalProperties: true
          description: Supported portable WAF fields; excludes per-site credentials.
    TemplateExport:
      type: object
      properties:
        catwaf_template:
          type: integer
          enum:
            - 1
        id:
          type: string
        label:
          type: string
        description:
          type: string
        settings:
          type: object
          additionalProperties: true
          description: Validated settings grouped by name; secrets are discarded.
        waf:
          type: object
          additionalProperties: true
          description: Portable WAF fields.
        exported_at:
          type: string
          format: date-time
      required:
        - catwaf_template
    Snapshot:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        timestamp:
          type: string
        created_by:
          type: string
    Rule:
      type: object
      properties:
        id:
          type: string
        known:
          type: boolean
        enabled:
          type: boolean
        category:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
        paranoia_level:
          type: integer
          nullable: true
        phase:
          type: integer
          nullable: true
        targets:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        disabled_by:
          type: string
          nullable: true
    LogEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
        ip:
          type: string
          nullable: true
        method:
          type: string
        uri:
          type: string
        status:
          type: integer
        action:
          type: string
        attack_type:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
        anomaly_score:
          type: number
          nullable: true
        country_code:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        rule_ids:
          type: array
          items:
            type: string
    ConfigPreview:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        label:
          type: string
        changed:
          type: boolean
        summary:
          type: object
          properties:
            added:
              type: integer
            removed:
              type: integer
        hunks:
          type: array
          items:
            type: object
        result:
          type: object
        render_report:
          type: object
        unified:
          type: string
    Alerts:
      type: object
      properties:
        slack_webhook:
          type: string
        email_to:
          type: string
        custom_webhook:
          type: string
        telegram_bot_token:
          type: string
        telegram_chat_id:
          type: string
        discord_webhook:
          type: string
        spike_threshold:
          type: number
          minimum: 1
        alert_on_block:
          type: boolean
        alert_on_spike:
          type: boolean
        alert_on_engine_change:
          type: boolean
    CatAIFrame:
      type: object
      properties:
        t:
          type: string
          enum:
            - status
            - token
            - correction
            - action
            - done
            - error
        v:
          description: Frame-specific text or action/status object.
        code:
          type: string
        detail:
          type: string
      required:
        - t
paths:
  /api/alerts:
    get:
      tags:
        - Alerts
      summary: Read alert delivery configuration
      description: Webhook URLs and tokens are redacted for viewers.
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Rotating API segment expired; obtain a fresh segment from /api/handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: get_api_alerts
      x-catwaf-source: backend/routes/alerts.js
      security:
        - bearerAuth: []
          requestSignature: []
          requestTimestamp: []
          requestNonce: []
      x-catwaf-access: session
      servers:
        - url: /g/{segment}
          description: Use the current segment returned by login or handshake.
          variables:
            segment:
              default: '00000000000000000000000000000000'
              description: Replace with api.segment from the live session; the placeholder is not usable.
    post:
      tags:
        - Alerts
      summary: Save allowed alert configuration fields
      description: |-
        Unknown fields are ignored and reported; empty strings remove values. The response redacts secrets.

        Requires the admin role.
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  alerts:
                    $ref: '#/components/schemas/Alerts'
                  ignored:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid input or refused operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Rotating API segment expired; obtain a fresh segment from /api/handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alerts'
      operationId: post_api_alerts
      x-catwaf-source: backend/routes/alerts.js
      security:
        - bearerAuth: []
          requestSignature: []
          requestTimestamp: []
          requestNonce: []
      x-catwaf-access: admin
      servers:
        - url: /g/{segment}
          description: Use the current segment returned by login or handshake.
          variables:
            segment:
              default: '00000000000000000000000000000000'
              description: Replace with api.segment from the live session; the placeholder is not usable.
  /api/alerts/test:
    post:
      tags:
        - Alerts
      summary: Deliver a test webhook alert
      description: >-
        Uses the saved HTTPS destination with SSRF protection. Email returns 400 because email delivery is not
        implemented.


        Requires the admin role.
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid input or refused operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Rotating API segment expired; obtain a fresh segment from /api/handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Upstream service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                    - slack
                    - discord
                    - custom
                    - email
              required:
                - channel
      operationId: post_api_alerts_test
      x-catwaf-source: backend/routes/alerts.js
      security:
        - bearerAuth: []
          requestSignature: []
